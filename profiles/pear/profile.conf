# ==============================================================================
# Pear profile metadata (Pulsar OS)
# Sourced by build-iso.sh — plain KEY=VALUE, no logic here.
# ==============================================================================

# Shown in GRUB/rEFInd menu entries and the final build banner
PROFILE_DISPLAY_NAME="Pulsar OS"

# Short identifier: GRUB --class prefix, rEFInd default_selection tag,
# boot-icon filename prefix (os_<slug>_*.png), sudoers cleanup glob,
# local-dev apt pin filename, Calamares try_remove package name suffix
PROFILE_SLUG="pulsaros"

# Bootloader used when --grub/--refind isn't passed, and the set of
# bootloaders this profile ships theming/packages for. build-iso.sh refuses
# to build with a bootloader that isn't in this list.
PROFILE_DEFAULT_BOOTLOADER="grub"
PROFILE_SUPPORTED_BOOTLOADERS=(grub refind)

# ISO9660 volume label (must match what the boot chain searches for)
PROFILE_ISO_LABEL="PULSAR_ISO"

# Output filename prefix: $PROFILE_ISO_PREFIX-$BRANCH[...].iso
PROFILE_ISO_PREFIX="pulsaros"

# Theme directory names shipped by the profile's theme packages
PROFILE_GRUB_THEME_NAME="Particle-circle-window"
PROFILE_REFIND_THEME_NAME="rEFInd-Regular-Dark"
PROFILE_REFIND_THEME_REPO="https://github.com/Inled-Pulsar-OS/refind-mac-theme"

# Plymouth theme name installed by the profile's plymouth package
PROFILE_PLYMOUTH_THEME="pulsar-plymouth"

# Boot-icon resolution: installed-package dir name inside the chroot,
# and the remote repo to shallow-clone from if no local copy is found
PROFILE_BOOT_ICONS_PKG_DIR_NAME="pulsar-boot-icons"
PROFILE_BOOT_ICONS_REMOTE_REPO="https://github.com/Inled-Pulsar-OS/PKG.git"
