# ==============================================================================
# Pear profile metadata (pearOS)
# Sourced by build-iso.sh — plain KEY=VALUE, no logic here.
# ==============================================================================

# Shown in the Ploader/syslinux menu entries and the final build banner
PROFILE_DISPLAY_NAME="pearOS"

# Short identifier: Ploader default_selection tag, boot-icon filename
# (theme/icons/os_<slug>.png in profiles/<name>/ploader/), sudoers cleanup
# glob, local-dev apt pin filename, Calamares try_remove package name suffix
PROFILE_SLUG="pearos"

# ISO9660 volume label (must match what the boot chain searches for)
PROFILE_ISO_LABEL="PEAR_SO"

# Output filename prefix: $PROFILE_ISO_PREFIX-$BRANCH[...].iso
PROFILE_ISO_PREFIX="pearos"

# Plymouth theme, set explicitly in customize.sh's profile_customize(). Ships
# as part of the pearos-settings package itself (usr/share/plymouth/themes/
# pear-plymouth/, confirmed in both the Arch and Debian apt.pearos.xyz builds)
# -- not a separate plymouth-theme-* package, so nothing extra to install.
PROFILE_PLYMOUTH_THEME="pear-plymouth"

# NOTE: currently unused -- these fed resolve_boot_icons() for the old
# GRUB/rEFInd boot-menu icons, which was removed when the engine switched to
# Ploader's own vendored theme/icons/. Left in place in case a future profile
# still wants a separate boot-icons source; safe to delete if not.
PROFILE_BOOT_ICONS_PKG_DIR_NAME="pearos-boot-icons"
PROFILE_BOOT_ICONS_REMOTE_REPO=""
