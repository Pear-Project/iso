# Ported from pearOS-archlinux/pear-calamares-config's
# shellprocess-pear-autouser.conf, adapted for Debian:
#   - arch-chroot -> chroot (plain Debian chroot, no arch-chroot on this system)
#   - wheel group -> sudo group (Debian's convention, not Arch's)
#   - doesn't re-copy /usr/share/pearOS-installer or bin_post into the target:
#     both are already baked into the squashfs at build time (see
#     profiles/pear/customize.sh), so unpackfs already put them on the
#     target -- redoing it here would be redundant.
#   - removes liveuser from the target: it only exists for the live session
#     (baked in at build time, see customize.sh) and unlike Arch's setup
#     there's no separate "removeuser" Calamares module on Debian to do
#     this as a first-class step, so it's folded in here instead.
#   - repoints SDDM's autologin at "default": /etc/sddm.conf.d/autologin.conf
#     was baked in at build time with User=liveuser for the live session --
#     copied verbatim onto the target by unpackfs, it would still say
#     liveuser (now deleted) instead of the new account, and SDDM would
#     fall through to a manual login prompt instead of autologin.
#   - adds the post-install autostart entry into /etc/skel *before* useradd
#     -m runs, same order as Arch's script, so it's picked up by the skel
#     copy when "default"'s home gets created -- Icon= is an absolute path
#     here (nicec0re-logo, Arch's icon name, doesn't exist in our icon
#     theme) instead of a theme-lookup name. Also drops the X-DBUS-*
#     keys Arch's version has: pearos-settings' own working autostart
#     entries (pearos-notch.desktop, welcome.desktop) don't use them, and
#     with them plasma-session apparently waits for D-Bus activation
#     that never happens (no matching /usr/share/dbus-1/services/ file)
#     instead of just spawning Exec= directly -- confirmed by comparison,
#     not by KDE's "untrusted" file-permission mechanism (which does NOT
#     apply to ~/.config/autostart/, only to Desktop icons -- both the
#     working autostart entries here are plain 0644, no +x).
#
# This runs outside the target chroot (dontChroot: true) and uses ${ROOT}
# as the target root mountpoint.

---

i18n:
    name: "Configure pearOS default user"

dontChroot: true
timeout: 1000

script:
    # Remove the live-session-only account from the installed system
    - command: "chroot ${ROOT} deluser --remove-home liveuser"

    # Create the post-install autostart entry in skel, before the new user's
    # home gets created from it below. One "echo >>" per line (matching
    # Arch's own script) instead of a heredoc -- much safer to get right as
    # a single-line YAML "command:" string.
    - command: "mkdir -p ${ROOT}/etc/skel/.config/autostart"
    - command: "bash -c 'echo \"[Desktop Entry]\" > ${ROOT}/etc/skel/.config/autostart/xyz.pearos-post-install.desktop'"
    - command: "bash -c 'echo \"Type=Application\" >> ${ROOT}/etc/skel/.config/autostart/xyz.pearos-post-install.desktop'"
    - command: "bash -c 'echo \"Name=pearOS Post Install\" >> ${ROOT}/etc/skel/.config/autostart/xyz.pearos-post-install.desktop'"
    - command: "bash -c 'echo \"GenericName=PostInstall\" >> ${ROOT}/etc/skel/.config/autostart/xyz.pearos-post-install.desktop'"
    - command: "bash -c 'echo \"Comment=Scripts for the after-install time\" >> ${ROOT}/etc/skel/.config/autostart/xyz.pearos-post-install.desktop'"
    - command: "bash -c 'echo \"Icon=/usr/share/pixmaps/pearos-logo.png\" >> ${ROOT}/etc/skel/.config/autostart/xyz.pearos-post-install.desktop'"
    - command: "bash -c 'echo \"Categories=Utility;\" >> ${ROOT}/etc/skel/.config/autostart/xyz.pearos-post-install.desktop'"
    - command: "bash -c 'echo \"Exec=bash /usr/local/bin/bin_post\" >> ${ROOT}/etc/skel/.config/autostart/xyz.pearos-post-install.desktop'"
    - command: "bash -c 'echo \"Terminal=false\" >> ${ROOT}/etc/skel/.config/autostart/xyz.pearos-post-install.desktop'"

    # Create default user in the target system and configure sudo + autologin
    # Username: default
    # Password: pearos  (change later with `passwd default`)
    - command: "chroot ${ROOT} useradd -m -s /bin/bash default"
    - command: "chroot ${ROOT} bash -c \"echo 'default:pearos' | chpasswd\""
    - command: "chroot ${ROOT} usermod -aG sudo,audio,video,plugdev,netdev,cdrom,dialout,bluetooth default"

    # Passwordless sudo for "default", matching Arch's
    # "default ALL=(ALL) NOPASSWD:ALL" sudoers line -- a drop-in file here
    # instead of editing /etc/sudoers directly (Debian convention). Must be
    # root-owned and exactly 0440 or sudo refuses to read it at all.
    - command: "bash -c 'echo \"default ALL=(ALL:ALL) NOPASSWD: ALL\" > ${ROOT}/etc/sudoers.d/010-pearos-default-nopasswd'"
    - command: "chmod 0440 ${ROOT}/etc/sudoers.d/010-pearos-default-nopasswd"

    # Autologin the installed system straight into "default", same as Arch
    - command: "sed -i 's/^User=.*/User=default/' ${ROOT}/etc/sddm.conf.d/autologin.conf"
