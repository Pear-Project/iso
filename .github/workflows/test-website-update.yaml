name: TEST - website update (no real build)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - name: Fake a build output (no real ISO, no R2 upload)
        run: |
          echo "fake iso content, not a real image" > pearOS-TEST-DoNotUse.iso
          sha256sum pearOS-TEST-DoNotUse.iso > pearOS-TEST-DoNotUse.iso.sha256.txt
          echo "ISO_FILE=./pearOS-TEST-DoNotUse.iso" >> "$GITHUB_ENV"
          echo "SHA_FILE=./pearOS-TEST-DoNotUse.iso.sha256.txt" >> "$GITHUB_ENV"

      - name: Update pearOS website (Pear-Project/web) [TEST ENTRY, does not touch real Goldwing data]
        env:
          WEB_REPO_PAT: ${{ secrets.WEB_REPO_PAT }}
        run: |
          ISO_NAME=$(basename "$ISO_FILE")
          SIZE_BYTES=$(stat -c%s "$ISO_FILE")
          SIZE_HUMAN=$(awk -v b="$SIZE_BYTES" 'BEGIN{printf "%.1f GB", b/1000000000}')
          SHA256=$(awk '{print $1}' "$SHA_FILE")
          DOWNLOAD_URL="https://iso.pearos.xyz/iso/${ISO_NAME}"

          echo "ISO: $ISO_NAME"
          echo "Size: $SIZE_HUMAN ($SIZE_BYTES bytes)"
          echo "SHA256: $SHA256"

          clonedir=$(mktemp -d)
          git clone --depth 1 "https://x-access-token:${WEB_REPO_PAT}@github.com/Pear-Project/web.git" "$clonedir"
          cd "$clonedir"

          JSON_FILE="assets/data/debian-versions.json"
          if [ ! -f "$JSON_FILE" ]; then
            echo "[ ERR ]: $JSON_FILE not found in Pear-Project/web, skipping."
            exit 1
          fi

          tmpfile=$(mktemp)
          # Uses a distinct test-only entry name ("__CI_TEST_ENTRY__") so this
          # can never match/overwrite the real "Latest (Goldwing)" row --
          # this is purely to prove the WEB_REPO_PAT credential and push path
          # work end-to-end, without touching real production data.
          jq --arg size "$SIZE_HUMAN" --arg sha "$SHA256" --arg dl "$DOWNLOAD_URL" \
            '(map(select(.name == "__CI_TEST_ENTRY__")) | length) as $exists |
             if $exists > 0 then
               map(if .name == "__CI_TEST_ENTRY__" then .status="Available" | .size=$size | .sha256=$sha | .download=$dl else . end)
             else
               . + [{"name":"__CI_TEST_ENTRY__","status":"Available","size":$size,"sha256":$sha,"download":$dl}]
             end' \
            "$JSON_FILE" > "$tmpfile"
          mv "$tmpfile" "$JSON_FILE"

          git config user.name "pearOS build bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- "$JSON_FILE"; then
            echo "No changes to $JSON_FILE, nothing to commit."
            exit 0
          fi

          git add "$JSON_FILE"
          git commit -m "TEST: verify WEB_REPO_PAT push from Pear-Project/iso (safe to revert)"
          git push origin HEAD:main
