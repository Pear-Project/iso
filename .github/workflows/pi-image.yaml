name: Build pearOS Raspberry Pi image

# Builds the arm64 disk image (Debian forky + pearOS packages) on a GitHub-hosted
# arm64 runner and boots it in QEMU (aarch64 'virt' + UEFI) to see how far it gets.
# Manual only for now.
on:
  workflow_dispatch:
    inputs:
      boot_test:
        description: "Boot the image in QEMU and take screenshots"
        type: boolean
        default: true
      runner:
        description: "github = hosted arm64 runner (QEMU emulated, ~95 min); pi5 = the self-hosted Raspberry Pi 5 (QEMU with KVM, see pi/ci-runner-setup.sh)"
        type: choice
        options: [github, pi5]
        default: github

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ${{ inputs.runner == 'pi5' && fromJSON('["self-hosted","linux","ARM64","pi5"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 340
    steps:
      - name: Checking out source code
        uses: actions/checkout@v4

      - name: Checking out the shared test harness
        uses: actions/checkout@v4
        with:
          repository: pearOS-archlinux/iso
          path: harness

      - name: Free disk space
        run: |
          [ "${{ inputs.runner }}" = pi5 ] || sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /
          ls -l /dev/kvm || echo "no /dev/kvm"

      - name: Host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync dosfstools e2fsprogs fdisk xz-utils qemu-system-arm qemu-efi-aarch64 tesseract-ocr ffmpeg

      - name: Stage 1 - rootfs (mmdebstrap in a debian:forky container)
        run: |
          mkdir -p "$RUNNER_TEMP/pi-work"
          sudo docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/src -v "$RUNNER_TEMP/pi-work":/work debian:forky \
            bash -euxc '
              apt-get update
              apt-get install -y --no-install-recommends mmdebstrap debian-archive-keyring gnupg git ca-certificates
              /src/pi/build-pi-image.sh --stage rootfs --work /work
            '

      - name: Stage 2 - disk image (loop devices on the runner)
        run: |
          sudo pi/build-pi-image.sh --stage image --work "$RUNNER_TEMP/pi-work" --out "$GITHUB_WORKSPACE/out"
          ls -lh out/

      - name: Keep the image
        uses: actions/upload-artifact@v4
        with:
          name: pearos-pi-image
          path: out/*
          retention-days: 3
          compression-level: 0

      - name: Boot, first-boot setup and usability (QEMU, emulated - no KVM here)
        id: boottest
        if: inputs.boot_test
        continue-on-error: true
        run: |
          sudo rm -rf "$RUNNER_TEMP/pi-work/rootfs"
          # The hosted arm runner has no /dev/kvm: QEMU runs the arm64 guest emulated, roughly
          # 5-10x slower than on KVM, hence --slow 4 and the long timeouts.
          python3 harness/tests/boot-test.py out/pearOS-Goldwing-Pi-*-arm64.img.xz --distro debian-pi \
            --full-install --upgrade-reboot --slow ${{ inputs.runner == 'pi5' && '1' || '4' }} --duration 2400 --reboot-wait 1500 \
            --pacman-timeout 3600 --interval 20 --memory 6G \
            --disk-dir "$RUNNER_TEMP/pi-disk" --workdir "$GITHUB_WORKSPACE" --update-reference

      - name: Upload test screenshots
        if: always() && inputs.boot_test
        uses: actions/upload-artifact@v4
        with:
          name: pi-boot-sequence
          path: seq/

      - name: Keep the UI reference this run produced (review it before committing)
        if: always() && inputs.boot_test
        uses: actions/upload-artifact@v4
        with:
          name: pi-ui-reference
          path: harness/tests/ui-reference/debian-pi/
          if-no-files-found: ignore

      # The site's Raspberry Pi page and the repo show the boot/first-boot/usability sequence.
      # Only web-sized copies are committed (the full PNG set is in the pi-boot-sequence artifact),
      # and nothing here publishes the image itself: no R2 upload, no announcement.
      - name: Publish the test sequence (screenshots + result, not the image)
        if: always() && inputs.boot_test && hashFiles('seq/result.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clonedir=$(mktemp -d)
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$clonedir"
          cd "$clonedir"
          rm -rf seq-pi && mkdir -p seq-pi/web
          cp "$GITHUB_WORKSPACE/seq/result.json" seq-pi/
          for f in "$GITHUB_WORKSPACE"/seq/[0-9]*.png; do
            ffmpeg -loglevel error -y -i "$f" -vf scale=960:-1 -quality 70 \
              "seq-pi/web/$(basename "${f%.png}").webp" || true
          done
          # Same README the harness writes, with the images pointing at the web copies.
          if [ -f "$GITHUB_WORKSPACE/README.md" ]; then
            { echo "# Raspberry Pi image: boot test"; echo
              sed -n '/<!-- boot-seq:begin -->/,/<!-- boot-seq:end -->/p;/<!-- ui-sanity:begin -->/,/<!-- ui-sanity:end -->/p' "$GITHUB_WORKSPACE/README.md" \
                | sed 's#seq/\([0-9]*\)\.png#web/\1.webp#g'; } > seq-pi/README.md
          fi
          grep -q "seq-pi/README.md" README.md || printf '\n## Raspberry Pi (arm64)\n\nLatest boot / first-boot / usability test sequence: [seq-pi/README.md](seq-pi/README.md)\n' >> README.md
          git config user.name "pearOS build bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A seq-pi README.md
          git diff --cached --quiet && exit 0
          git commit -m "Pi test sequence from run ${GITHUB_RUN_ID} [skip ci]"
          git push origin "${GITHUB_REF_NAME}"
